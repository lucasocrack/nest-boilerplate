version: '3.8'
services:
  api:
    build: .
    ports:
      - '3099:3099'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/nest-boilerplate?schema=public
    depends_on:
      - db
    command: >
      sh -c "npx prisma migrate deploy && node dist/main"

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nest-boilerplate
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
